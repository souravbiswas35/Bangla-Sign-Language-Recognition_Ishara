<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d16" />
    <meta name="description" content="ইশারা (Ishara) — Real-time AI Bangla Sign Language Translation Platform using MediaPipe Tasks Vision and Deep Learning Transformers. Translate 100 sign vocabulary classes instantly via webcam or benchmark video." />
    <title>ইশারা · Ishara — Bangla Sign Language AI Translation System</title>

    <!-- Preconnect to Google Fonts for optimal performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Immediate theme bootstrap script to avoid flicker -->
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('ishara-theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = savedTheme || (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
